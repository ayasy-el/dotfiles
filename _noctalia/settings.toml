config_version = 15

[bar.default]
background_opacity = 0.51999998837709427
capsule = true
capsule_group = []
center = [ "media", "clock", "caffeine", "indicator" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "cpu",
    "ram",
    "temp",
    "battery",
    "control-center",
    "session"
]
margin_ends = 20
radius = 10
scale = 0.95000000670552254
start = [ "launcher", "wallpaper", "workspaces", "audio_visualizer" ]
thickness = 24

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "liamwh/emoji-picker", "rxtsel/portctl" ]

[shell.launcher]
show_session_button = false
show_settings_button = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
command = "qdbus org.kde.KWin /Session quit"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[shell.window_switcher]
style = "compact"

[theme]
shell_mode = "dark"
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/ayasy/Pictures/Wallpapers/ddg_1776709026050161588.jpg"

[wallpaper.last]
path = "/home/ayasy/Pictures/Wallpapers/ddg_1776709026050161588.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ayasy/Pictures/Wallpapers/ddg_1776709026050161588.jpg"

[widget.audio_visualizer]
capsule = true
capsule_opacity = 0.0
show_when_idle = true
width = 220

    [widget.audio_visualizer.actions]
    left = "panel-toggle control-center media"
    right = "media toggle"

[widget.clipboard]
enabled = false

[widget.indicator]
type = "rxtsel/portctl:indicator"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.workspaces]
capsule = true
capsule_opacity = 0.0
style = "minimal"
[control_center]
sidebar_section = "none"

[shell.panel]
open_near_click_control_center = true
